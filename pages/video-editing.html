    <style>
        .edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-top: 40px; }

        .video-box { position: relative; padding-bottom: 56.25%; height: 0; margin-top: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; }
    </style>
